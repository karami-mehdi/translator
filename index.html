<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translator</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f7fa;
        color: #26374b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .container {
        max-width: 1000px;
        margin: 65px auto;
        padding: 0 24px;
      }

      header {
        margin-bottom: 35px;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #78889a;
        font-size: 14px;
      }

      .translator {
        background: white;
        border: 1px solid #e1e6ed;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.035);
      }

      .languages {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 600;
      }

      .language {
        color: #315d85;
      }

      .language-box {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 13px 16px;
        border: 1px solid #dce2e9;
        border-radius: 8px;
        background: #edf2f7;
      }

      .swap {
        background: #edf2f7;
        color: #315d85;
        border: 1px solid #a9b6c4;
        padding: 11px 16px;
        font-size: 20px;
      }

      button {
        border: none;
        border-radius: 7px;
        cursor: pointer;
        transition: 0.2s;
      }

      .swap:hover,
      .secondary:hover {
        background: #9dbbd9;
      }

      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .panel {
        border: 1px solid #dce2e9;
        border-radius: 8px;
        overflow: hidden;
      }

      .panel-header {
        background: #f8fafc;
        padding: 12px 15px;
        font-size: 13px;
        font-weight: 600;
        border-bottom: 1px solid #e6eaf0;
      }

      textarea {
        display: block;
        width: 100%;
        height: 230px;
        resize: none;
        border: none;
        outline: none;
        padding: 16px;
        font-family: inherit;
        font-size: 15px;
        line-height: 1.7;
        color: #26374b;
      }

      textarea:focus {
        background: #fcfdff;
      }

      textarea:disabled {
        background: #edf2f7;
        opacity: 1;
      }

      textarea[dir="rtl"] {
        direction: rtl;
        text-align: right;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 20px;
        gap: 12px;
      }

      .primary {
        background: #315d85;
        color: white;
        padding: 13px 28px;
        font-size: 14px;
        font-weight: 600;
      }

      .primary:hover {
        background: #244766;
      }

      .primary:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .secondary {
        background: #edf2f7;
        color: #315d85;
        padding: 11px 18px;
        margin-right: 5px;
        border: 1px solid #a9b6c4;
      }

      .status {
        margin-top: 20px;
        color: #7d8997;
        font-size: 13px;
        min-height: 18px;
      }

      footer {
        margin-top: 25px;
        text-align: center;
        color: #98a3af;
        font-size: 12px;
      }

      @media (max-width: 650px) {
        .container {
          margin: 30px auto;
        }
        .panels {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Translator</h1>
        <div class="subtitle">Natural Language Processing</div>
      </header>

      <main class="translator">
        <div class="languages">
          <div class="language-box" id="sourceLabel">
            <span class="language">English</span>
          </div>

          <button class="swap" id="swap" title="Reverse translation direction">
            ⇄
          </button>

          <div class="language-box" id="targetLabel">
            <span class="language">Persian</span>
          </div>
        </div>

        <div class="panels">
          <section class="panel">
            <div class="panel-header">Input text</div>
            <textarea id="input"></textarea>
          </section>

          <section class="panel">
            <div class="panel-header">Translation</div>
            <textarea id="output" disabled></textarea>
          </section>
        </div>

        <div class="actions">
          <span id="counter" class="subtitle">0 characters</span>

          <div>
            <button class="secondary" id="clear">Clear</button>
            <button class="secondary" id="copy">Copy</button>
            <button class="primary" id="translate">Translate</button>
          </div>
        </div>

        <div class="status" id="status">
          Ready. Internet connection required.
        </div>
      </main>

      <footer>© November 2026, Mehdi Karami</footer>
    </div>

    <script>
      let sourceLanguage = "en";
      let targetLanguage = "fa";

      const input = document.getElementById("input");
      const output = document.getElementById("output");

      const translateButton = document.getElementById("translate");
      const status = document.getElementById("status");
      const counter = document.getElementById("counter");

      function updateDirection() {
        input.dir = sourceLanguage === "fa" ? "rtl" : "ltr";
        output.dir = targetLanguage === "fa" ? "rtl" : "ltr";

        input.style.textAlign = sourceLanguage === "fa" ? "right" : "left";

        output.style.textAlign = targetLanguage === "fa" ? "right" : "left";

        document.getElementById("sourceLabel").textContent =
          sourceLanguage === "en" ? "English" : "Persian";

        document.getElementById("targetLabel").textContent =
          targetLanguage === "en" ? "English" : "Persian";
      }

      input.addEventListener("input", () => {
        counter.textContent = input.value.length + " characters";
      });

      document.getElementById("swap").addEventListener("click", () => {
        [sourceLanguage, targetLanguage] = [targetLanguage, sourceLanguage];

        [input.value, output.value] = [output.value, input.value];

        counter.textContent = input.value.length + " characters";

        updateDirection();

        status.textContent = "Languages switched.";
      });

      document.getElementById("clear").addEventListener("click", () => {
        input.value = "";
        output.value = "";

        counter.textContent = "0 characters";
        status.textContent = "Text cleared.";

        input.focus();
      });

      translateButton.addEventListener("click", async () => {
        const text = input.value.trim();

        if (!text) {
          status.textContent = "Please enter some text.";
          return;
        }

        translateButton.disabled = true;
        translateButton.textContent = "Translating...";
        output.value = "";
        status.textContent = "Contacting translation service...";

        try {
          const response = await fetch(
            "https://translator-backend-emxu.onrender.com/translate",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                text: text,
                source: sourceLanguage,
                target: targetLanguage,
              }),
            },
          );

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Translation failed.");
          }

          output.value = data.translation;
          status.textContent = "Translation completed successfully.";
        } catch (error) {
          status.textContent = "Error: " + error.message;
        } finally {
          translateButton.disabled = false;
          translateButton.textContent = "Translate";
        }
      });

      document.getElementById("copy").addEventListener("click", async () => {
        if (!output.value) {
          status.textContent = "Nothing to copy.";
          return;
        }

        try {
          await navigator.clipboard.writeText(output.value);
          status.textContent = "Translation copied.";
        } catch {
          status.textContent = "Clipboard access unavailable.";
        }
      });

      updateDirection();
    </script>
  </body>
</html>
