<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.8" />
    <title>Translator</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f7fa;
        color: #26374b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .container {
        max-width: 1000px;
        margin: 65px auto;
        padding: 0 24px;
      }

      header {
        margin-bottom: 35px;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #78889a;
        font-size: 14px;
      }

      .translator {
        background: white;
        border: 1px solid #e1e6ed;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.035);
      }

      .languages {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 600;
      }

      .language {
        color: #315d85;
      }

      .language-box {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 13px 16px;
        border: 1px solid #dce2e9;
        border-radius: 8px;
        background: #edf2f7;
      }

      .swap {
        background: #edf2f7;
        color: #315d85;
        border: 1px solid #a9b6c4;
        padding: 11px 16px;
        font-size: 20px;
      }

      button {
        border: none;
        border-radius: 7px;
        cursor: pointer;
        transition: 0.2s;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      @media (hover: hover) and (pointer: fine) {
        .swap:hover,
        .secondary:hover {
          background: #b7c9dc;
        }

        .primary:hover {
          background: #244766;
        }

        footer a:hover {
          text-decoration: underline;
        }
      }

      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .panel {
        border: 1px solid #dce2e9;
        border-radius: 8px;
        overflow: hidden;
      }

      .panel-header {
        background: #f8fafc;
        padding: 12px 15px;
        font-size: 13px;
        font-weight: 600;
        border-bottom: 1px solid #e6eaf0;
      }

      textarea {
        display: block;
        width: 100%;
        height: 230px;
        resize: none;
        border: none;
        outline: none;
        padding: 16px;
        font-family: inherit;
        font-size: 15px;
        line-height: 1.7;
        color: #26374b;
      }

      textarea:focus {
        background: #fcfdff;
      }

      textarea:disabled {
        background: #edf2f7;
        opacity: 1;
      }

      textarea[dir="rtl"] {
        direction: rtl;
        text-align: right;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 20px;
        gap: 12px;
      }

      .primary {
        background: #315d85;
        color: white;
        padding: 13px 28px;
        font-size: 14px;
        font-weight: 600;
      }

      .secondary {
        background: #edf2f7;
        color: #315d85;
        padding: 11px 18px;
        margin-right: 5px;
        border: 1px solid #a9b6c4;
      }

      .status {
        margin-top: 20px;
        color: #7d8997;
        font-size: 13px;
        min-height: 18px;
      }

      footer {
        margin-top: 25px;
        text-align: center;
        color: #98a3af;
        font-size: 12px;
      }

      footer a {
        color: #315d85;
        text-decoration: none;
      }

      @media (max-width: 650px) {
        .container {
          margin: 30px auto;
        }

        .panels {
          grid-template-columns: 1fr;
        }

        .actions {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Translator</h1>
      </header>

      <main class="translator">
        <div class="languages">
          <div class="language-box" id="sourceLabel">
            <span class="language">English</span>
          </div>

          <button
            class="swap"
            id="swap"
            title="Reverse translation direction"
            aria-label="Swap languages"
          >
            ⇄
          </button>

          <div class="language-box" id="targetLabel">
            <span class="language">Persian</span>
          </div>
        </div>

        <div class="panels">
          <section class="panel">
            <div class="panel-header">Input text</div>
            <textarea id="input"></textarea>
          </section>

          <section class="panel">
            <div class="panel-header">Translation</div>
            <textarea id="output" disabled></textarea>
          </section>
        </div>

        <div class="actions">
          <span id="counter" class="subtitle">0 characters</span>

          <div>
            <button class="secondary" id="clear">Clear</button>
            <button class="secondary" id="copy">Copy</button>
            <button class="primary" id="translate">Translate</button>
          </div>
        </div>

        <div class="status" id="status" aria-live="polite">Ready.</div>
      </main>

      <footer>
        Source code
        <a
          href="https://github.com/karami-mehdi/translator"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        <br />
        © November 2026, Mehdi Karami
      </footer>
    </div>

    <!-- WebAssembly module configuration -->
    <script>
      var wasmReady = false;

      var Module = {
        onRuntimeInitialized: function () {
          wasmReady = true;

          console.log("C++ WebAssembly module is ready.");

          document.getElementById("status").textContent = "Ready.";
        },

        onAbort: function (reason) {
          wasmReady = false;

          console.error("WebAssembly initialization failed:", reason);

          document.getElementById("status").textContent =
            "WebAssembly initialization failed.";
        },
      };
    </script>

    <!-- Load the generated Emscripten JavaScript runtime -->
    <script src="./translator.js"></script>

    <script>
      let sourceLanguage = "en";
      let targetLanguage = "fa";

      let translationInProgress = false;
      let requestId = 0;

      const input = document.getElementById("input");
      const output = document.getElementById("output");

      const translateButton = document.getElementById("translate");
      const swapButton = document.getElementById("swap");
      const clearButton = document.getElementById("clear");

      const status = document.getElementById("status");
      const counter = document.getElementById("counter");

      const sourceLabel = document.getElementById("sourceLabel");
      const targetLabel = document.getElementById("targetLabel");

      // Update language labels and text directions.
      function updateDirection() {
        input.dir = sourceLanguage === "fa" ? "rtl" : "ltr";
        output.dir = targetLanguage === "fa" ? "rtl" : "ltr";

        sourceLabel.querySelector(".language").textContent =
          sourceLanguage === "en" ? "English" : "Persian";

        targetLabel.querySelector(".language").textContent =
          targetLanguage === "en" ? "English" : "Persian";
      }

      // Update character counter.
      input.addEventListener("input", () => {
        counter.textContent = input.value.length + " characters";
      });

      // Swap source and target languages.
      swapButton.addEventListener("click", () => {
        if (translationInProgress) return;

        [sourceLanguage, targetLanguage] = [targetLanguage, sourceLanguage];

        [input.value, output.value] = [output.value, input.value];

        counter.textContent = input.value.length + " characters";

        updateDirection();

        status.textContent = "Languages switched.";
      });

      // Clear input and output.
      clearButton.addEventListener("click", () => {
        if (translationInProgress) return;

        input.value = "";
        output.value = "";

        counter.textContent = "0 characters";
        status.textContent = "Text cleared.";

        input.focus();
      });

      // Receive successful translation from C++.
      window.onCppTranslationSuccess = function (translation) {
        if (!translationInProgress) return;

        output.value = translation;

        status.textContent = "Translation completed successfully.";

        translationInProgress = false;
        translateButton.disabled = false;
        swapButton.disabled = false;
        clearButton.disabled = false;
        translateButton.textContent = "Translate";
      };

      // Receive translation errors from C++.
      window.onCppTranslationError = function (message) {
        if (!translationInProgress) return;

        status.textContent = "Error: " + message;

        translationInProgress = false;
        translateButton.disabled = false;
        swapButton.disabled = false;
        clearButton.disabled = false;
        translateButton.textContent = "Translate";
      };

      // Translate using the C++ WebAssembly module.
      translateButton.addEventListener("click", () => {
        const text = input.value.trim();

        if (!text) {
          status.textContent = "Please enter some text.";
          return;
        }

        if (!wasmReady || typeof Module.ccall !== "function") {
          status.textContent = "Translation module is not ready yet.";
          return;
        }

        if (translationInProgress) return;

        translationInProgress = true;
        requestId++;

        translateButton.disabled = true;
        swapButton.disabled = true;
        clearButton.disabled = true;

        translateButton.textContent = "Translating...";

        output.value = "";
        status.textContent = "Contacting translation service...";

        try {
          Module.ccall(
            "translate",
            null,
            ["string", "string", "string"],
            [text, sourceLanguage, targetLanguage],
          );
        } catch (error) {
          window.onCppTranslationError(error.message);
        }
      });

      // Copy translated text.
      document.getElementById("copy").addEventListener("click", async () => {
        if (!output.value) {
          status.textContent = "Nothing to copy.";
          return;
        }

        try {
          await navigator.clipboard.writeText(output.value);
          status.textContent = "Translation copied.";
        } catch {
          status.textContent = "Clipboard access unavailable.";
        }
      });

      // Initialize the interface.
      updateDirection();
    </script>
  </body>
</html>
